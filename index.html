<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OGN 3D Viewer</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="stylesheet" href="css/style.css">
<!-- deck.gl, UPNG and pako are bundled from npm by Bun; terrain tiles are decoded
     with UPNG on the main thread (deck.gl's worker path mangles the RGB-encoded
     elevation when served over http). See src/terrain.ts. -->
<script type="module" src="./src/main.ts"></script>
</head>
<body>
<!-- Opaque cover shown from the first paint (before the deferred module runs), so
     the empty 3D scene never flashes before the entry page is decided. JS removes it. -->
<div id="boot" style="position:fixed;inset:0;z-index:500;background:#0c1119"></div>
<div id="map"></div>
<div id="sun"></div>
<div id="moon"></div>
<div id="labels"></div>
<div id="poiLabels"></div>
<div id="minimap"><span class="mmN">N</span></div>
<div id="windDial" class="card" data-i18n-title="windHint" title="">
  <svg viewBox="-16 -16 32 32" width="40" height="40" xmlns="http://www.w3.org/2000/svg">
    <circle cx="0" cy="0" r="15" fill="#0e141b" stroke="rgba(255,255,255,.28)" stroke-width="1.5"/>
    <g id="windArrow"><polygon points="0,-11 5,6 0,2 -5,6" fill="#dfe8f4"/></g>
  </svg>
  <div class="windTxt"><b id="windSpd">–</b> km/h<br><small id="windDir"></small></div>
</div>
<div id="attribution"></div>

<div id="panel" class="card">
  <div class="row spread hdr" style="margin-top:0">
    <h1 data-i18n="h1">…</h1>
    <div style="display:flex;gap:6px;align-items:center">
      <button id="shareBtn" data-i18n-title="shareLink" title="" style="display:none">📤</button>
      <button id="copyBtn" data-i18n-title="copyLink" title="">🔗</button>
      <button id="exportBtn" data-i18n-title="exportImg" title="">📷</button>
      <button id="infoBtn" data-i18n-title="info" title="">ⓘ</button>
      <button id="collapseBtn" data-i18n-title="collapse" title="">▾</button>
    </div>
  </div>
  <div class="sub" data-i18n="sub">…</div>
  <div id="disclaimer" class="disc" style="display:none"></div>

  <div class="row"><button id="discoverBtn" data-i18n="discover" data-i18n-title="discoverHint" style="flex:1">🌍 Découvrir des spots</button></div>
  <div class="row" style="flex-direction:column;align-items:stretch">
    <div class="row spread" style="margin:0 0 3px;align-items:baseline">
      <label class="lbl" style="margin:0" data-i18n="airfieldLabel">Aérodrome (OACI)</label>
      <a id="fblink" class="fblink" target="_blank" rel="noopener" data-i18n-title="flightbook" title="">FlightBook ↗</a>
    </div>
    <div class="ac">
      <input id="icao" type="text" autocomplete="off" placeholder="LFMX" value="LFMX">
      <div id="aclist" class="aclist"></div>
    </div>
    <div id="afInfo" style="margin-top:4px;font-size:12px;color:var(--mut);display:none"></div>
  </div>
  <div class="row" style="align-items:flex-end">
    <div style="flex:1">
      <label class="lbl" data-i18n="dateLabel">Date</label>
      <input id="date" type="date">
    </div>
    <button id="load" class="on" data-i18n="loadBtn">Charger</button>
  </div>
  <div class="row seg" style="gap:6px">
    <button id="todayBtn" data-i18n="today" style="flex:1">Aujourd'hui</button>
    <button id="yestBtn" data-i18n="yesterday" style="flex:1">Hier</button>
  </div>
  <div class="row"><button id="liveBtn" data-i18n="live" style="flex:1">🔴 En direct</button></div>
  <div class="row"><button id="igcBtn" data-i18n="loadIgc" data-i18n-title="igcHint" style="flex:1">📂 Fichier de trace…</button></div>
  <input id="igcInput" type="file" accept=".igc,.IGC,.gpx,.GPX,.kml,.KML,.cup,.CUP,.plr,.PLR" multiple hidden>
  <div class="status" id="status"></div>

  <div id="controls">
    <div class="sep"></div>
    <div class="row"><span class="clock" data-i18n-title="clockToggle" title="" style="cursor:pointer"><span id="clk">--:--</span><small id="tz">…</small></span><span id="liveBadge"><span class="livedot"></span><span data-i18n="liveLabel">EN DIRECT</span></span></div>

    <div class="row liveHide">
      <button id="rev" data-i18n-title="playBack" title="">◀</button>
      <button id="play" class="on">▶</button>
      <div class="seg" id="speeds" style="flex-wrap:wrap;flex:1"></div>
    </div>
    <div class="row liveHide" style="flex-direction:column;align-items:stretch">
      <label class="lbl" data-i18n="timeOfDay">Heure de la journée</label>
      <input id="scrub" type="range" min="0" max="1000" value="0" step="1">
      <div class="scrubends"><span id="scrubMin">--:--</span><span id="scrubMax">--:--</span></div>
    </div>

    <div class="row">
      <label class="lbl" style="margin:0" data-i18n="view">Vue</label>
      <div class="seg" id="views"></div>
    </div>
    <div class="row fpvOnly">
      <label class="lbl" style="margin:0" data-i18n="camera">Caméra</label>
      <div class="seg" id="cammode"></div>
    </div>
    <div class="row subjOnly">
      <label class="lbl" style="margin:0" data-i18n="subject">Planeur suivi</label>
      <select id="subject"></select>
    </div>
    <div class="row"><button id="teleportBtn" data-i18n="teleport" data-i18n-title="teleportHint" style="flex:1">🛰 Téléportation…</button></div>
    <div class="row subjOnly spread">
      <label class="lbl" style="margin:0" data-i18n="sound">Son du vario</label>
      <button id="soundBtn" class="on">Activé</button>
    </div>
    <div class="row subjOnly spread">
      <label class="lbl" style="margin:0" data-i18n="antiColl">Anti-collision</label>
      <select id="trafficMode" style="width:auto;flex:0 0 auto"></select>
    </div>
    <div class="row spread">
      <label class="lbl" style="margin:0" data-i18n="graphs">Graphes</label>
      <select id="graphMode" style="width:auto;flex:0 0 auto"></select>
    </div>

    <div class="row">
      <label class="lbl" style="margin:0" data-i18n="trace">Trace</label>
      <select id="trace"></select>
    </div>
    <div class="row spread">
      <label class="lbl" style="margin:0" data-i18n="trailFx">Effet de trace</label>
      <select id="trailFx" style="width:auto;flex:0 0 auto"></select>
    </div>
    <div class="row spread">
      <label class="lbl" style="margin:0" data-i18n="smooth">Lissage (spline)</label>
      <button id="smoothBtn" class="on">Activé</button>
    </div>
    <div class="row spread">
      <label class="lbl" style="margin:0" data-i18n="varioComp">Vario compensé (énergie totale)</label>
      <button id="compBtn" class="on">Activé</button>
    </div>
    <div class="row spread">
      <label class="lbl" style="margin:0" data-i18n="nettoModeLabel" data-i18n-title="nettoModeHint">Netto (masse d'air)</label>
      <button id="nettoBtn">Désactivé</button>
    </div>
    <div class="row spread" id="polarRow">
      <label class="lbl" style="margin:0"><span data-i18n="polarLabel">Polaire (netto)</span> : <b id="polarName">ASK 21</b></label>
      <span style="display:flex;gap:4px">
        <button id="polarBtn" data-i18n="polarImport" data-i18n-title="polarHint">Importer .plr…</button>
        <button id="polarReset" data-i18n-title="polarResetHint" title="">↺</button>
      </span>
    </div>
    <input id="plrInput" type="file" accept=".plr,.PLR" hidden>
    <div class="row windowOnly" style="flex-direction:column;align-items:stretch">
      <label class="lbl"><span data-i18n="windowLabel">Fenêtre (min) :</span> <b id="winval">10</b></label>
      <input id="win" type="range" min="0" max="30" value="10" step="1">
    </div>

    <div class="row" style="flex-direction:column;align-items:stretch">
      <label class="lbl"><span data-i18n="exo">Exagération du relief vertical :</span> <b id="exval">1.0×</b></label>
      <input id="exo" type="range" min="1" max="6" value="1" step="0.5">
    </div>
    <div class="row" style="flex-direction:column;align-items:stretch">
      <label class="lbl"><span data-i18n="groundZoom">Résolution du sol :</span> <b id="groundval">z15</b></label>
      <input id="ground" type="range" min="13" max="18" value="15" step="1">
    </div>
    <div class="row spread">
      <label class="lbl" style="margin:0" data-i18n="basemapLabel">Fond de carte</label>
      <select id="basemap" style="width:auto;flex:0 0 auto"></select>
    </div>
    <div class="row spread">
      <label class="lbl" style="margin:0" data-i18n="ignDem" data-i18n-title="ignDemHint" title="">Détail France (IGN)</label>
      <button id="ignDemBtn">Désactivé</button>
    </div>
    <div class="row spread">
      <label class="lbl" style="margin:0" data-i18n="peaks" data-i18n-title="peaksHint" title="">Sommets (OSM)</label>
      <button id="peaksBtn">Désactivé</button>
    </div>
    <div class="row spread">
      <label class="lbl" style="margin:0" data-i18n="cols" data-i18n-title="colsHint" title="">Cols exploitables</label>
      <button id="colsBtn">Désactivé</button>
    </div>
    <div class="row spread">
      <label class="lbl" style="margin:0" data-i18n="buildings" data-i18n-title="buildingsHint" title="">Bâtiments (procédural)</label>
      <button id="buildingsBtn">Désactivé</button>
    </div>
    <div class="row spread">
      <label class="lbl" style="margin:0" data-i18n="minimap" data-i18n-title="minimapHint" title="">Mini-carte 2D</label>
      <button id="minimapBtn">Activé</button>
    </div>
    <div class="row spread">
      <label class="lbl" style="margin:0" data-i18n="overviewHud" data-i18n-title="overviewHudHint" title="">HUD en vue d'ensemble</label>
      <button id="overviewHudBtn">Désactivé</button>
    </div>
    <div class="row spread">
      <label class="lbl" style="margin:0" data-i18n="activeOnly" data-i18n-title="activeOnlyHint" title="">Aéronefs actifs seulement</label>
      <button id="activeOnlyBtn">Désactivé</button>
    </div>
    <div class="row spread">
      <label class="lbl" style="margin:0" data-i18n="anon" data-i18n-title="anonHint" title="">Mode anonyme</label>
      <button id="anonBtn">Désactivé</button>
    </div>
    <div class="row spread">
      <label class="lbl" style="margin:0" data-i18n="clockFormat" data-i18n-title="clockFormatHint" title="">Format de l'heure</label>
      <button id="clock12Btn">24 h</button>
    </div>
    <div class="row spread">
      <label class="lbl" style="margin:0" data-i18n="heightRef" data-i18n-title="heightRefHint" title="">Hauteur</label>
      <select id="heightRef" style="width:auto;flex:0 0 auto"></select>
    </div>
    <div class="row peaksOnly" style="flex-direction:column;align-items:stretch">
      <label class="lbl"><span data-i18n="peakDensity">Densité des sommets</span></label>
      <input id="peakDensity" type="range" min="0" max="1" value="0.35" step="0.05">
    </div>
    <div class="row wpOnly" style="flex-direction:column;align-items:stretch">
      <button id="clearWpBtn" data-i18n="clearWaypoints">🗑 Supprimer les waypoints importés</button>
    </div>
    <div class="row" style="flex-direction:column;align-items:stretch">
      <label class="lbl"><span data-i18n="cacheScale">Taille du cache :</span> <b id="cacheszval">×1</b></label>
      <input id="cachesz" type="range" min="0.5" max="4" value="1" step="0.5">
    </div>
    <div class="row" style="flex-direction:column;align-items:stretch">
      <label class="lbl"><span data-i18n="acScale">Taille des aéronefs (vue courante) :</span> <b id="acscaleval">16×</b></label>
      <input id="acscale" type="range" min="0.5" max="30" value="16" step="0.5">
    </div>
    <div class="row spread">
      <label class="lbl" style="margin:0" data-i18n="labels">Étiquettes</label>
      <button id="labelsBtn">Désactivé</button>
    </div>
    <div class="row labelsOnly spread">
      <label class="lbl" style="margin:0" data-i18n="labelFields">Champs</label>
      <div class="seg" id="labelFields"></div>
    </div>
    <div class="row spread">
      <label class="lbl" style="margin:0" data-i18n="shadows">Ombres au sol</label>
      <select id="shadows" style="width:auto;flex:0 0 auto"></select>
    </div>
    <div class="row spread">
      <label class="lbl" style="margin:0" data-i18n="altCurtain">Rideau d'altitude</label>
      <button id="curtainBtn">Désactivé</button>
    </div>
    <div class="row spread">
      <label class="lbl" style="margin:0" data-i18n="wind" data-i18n-title="windHint" title="">Vent</label>
      <select id="windMode" style="width:auto;flex:0 0 auto"></select>
    </div>
    <div class="row spread">
      <label class="lbl" style="margin:0" data-i18n="airMass" data-i18n-title="airMassHint" title="">Masse d'air</label>
      <button id="airMassBtn">Désactivé</button>
    </div>
    <div class="row spread">
      <label class="lbl" style="margin:0" data-i18n="thermalPot" data-i18n-title="thermalPotHint" title="">Potentiel de portance</label>
      <button id="thermalBtn">Désactivé</button>
    </div>
    <div class="row" id="liftComps" style="gap:16px;flex-wrap:wrap"></div>
    <div class="row thermalOnly" style="flex-direction:column;align-items:stretch">
      <label class="lbl" data-i18n="heatStore" data-i18n-title="heatStoreHint" title="">Inertie du sol (stockage)</label>
      <input id="heatStore" type="range" min="0" max="1" value="0.5" step="0.05">
    </div>
    <div id="dayStruct" style="margin-top:6px"></div>
    <div class="row spread">
      <label class="lbl" style="margin:0" data-i18n="wxSim" data-i18n-title="wxSimHint" title="">Simulateur météo</label>
      <button id="wxSimBtn">Désactivé</button>
    </div>
    <div id="wxSimPanel" style="display:none;padding:2px 0 6px"></div>
    <div class="row spread">
      <label class="lbl" style="margin:0" data-i18n="attribution">Attribution carte</label>
      <button id="attrBtn" class="on">Activé</button>
    </div>
    <div class="row spread">
      <label class="lbl" style="margin:0" data-i18n="exportFmtLabel">Format d'export</label>
      <select id="exportFmt" style="width:auto;flex:0 0 auto"><option value="png">PNG</option><option value="webp">WebP</option></select>
    </div>
    <div class="row spread">
      <label class="lbl" style="margin:0" data-i18n="langLabel">Langue</label>
      <select id="lang" class="langsel" style="width:auto;flex:0 0 auto" aria-label="Language"></select>
    </div>
    <div class="row spread">
      <label class="lbl" style="margin:0" data-i18n="resetSettings">Réinitialiser les réglages</label>
      <button id="resetSettings" data-i18n-title="resetSettings" title="">↺</button>
    </div>
    <div class="row spread">
      <label class="lbl" style="margin:0" data-i18n="glideCone">Cône de finesse</label>
      <button id="coneBtn">Désactivé</button>
    </div>
    <div class="row coneOnly" style="flex-direction:column;align-items:stretch">
      <label class="lbl"><span data-i18n="glideRatio">Finesse :</span> <b id="finval">10</b></label>
      <input id="finesse" type="range" min="5" max="60" value="10" step="1">
    </div>
    <div class="row coneOnly" style="flex-direction:column;align-items:stretch">
      <label class="lbl"><span data-i18n="safetyH">Hauteur de sécurité (m) :</span> <b id="safeval">0</b></label>
      <input id="safety" type="range" min="0" max="1000" value="0" step="50">
    </div>
    <div class="row coneOnly" style="flex-direction:column;align-items:stretch">
      <label class="lbl"><span data-i18n="coneRadius">Rayon de tracé (km) :</span> <b id="coneradval">25</b></label>
      <input id="conerad" type="range" min="0" max="100" value="25" step="5">
    </div>
    <div class="row followOnly spread">
      <label class="lbl" style="margin:0" data-i18n="bank">Inclinaison de l'horizon</label>
      <button id="bankBtn" class="on">Activé</button>
    </div>
    <div class="row followOnly" style="flex-direction:column;align-items:stretch">
      <label class="lbl"><span data-i18n="gaze">Regard (assiette caméra) :</span> <b id="pitchval">+6°</b></label>
      <input id="pitch" type="range" min="-25" max="25" value="6" step="1">
    </div>
    <div class="row freeOnly"><span class="hint" style="margin:0" data-i18n="freeHint">…</span></div>
    <div class="row"><button id="reset" data-i18n="defaultView">↺ Vue par défaut</button></div>
    <div class="hint" data-i18n="shortcuts">…</div>
  </div>
</div>

<div id="legend" class="card"><div class="ttl" data-i18n="legendTitle">…</div><div id="focusBadge"></div><div id="lglist"></div></div>

<div id="nav" class="card">
  <div class="navcol">
    <div class="nrow">
      <button id="rotL" data-i18n-title="rotL" title="">⟲</button>
      <div id="compass" class="compass" data-i18n-title="northUp" title="">
        <svg viewBox="0 0 40 40" width="42" height="42" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="18" fill="#0e141b" stroke="rgba(255,255,255,.28)" stroke-width="1.5"/>
          <g id="rose">
            <polygon points="20,4 24,20 20,16.5 16,20" fill="#ff5b5b"/>
            <polygon points="20,36 24,20 20,23.5 16,20" fill="#c7d2dd"/>
            <text x="20" y="12" text-anchor="middle" font-size="7" fill="#ff9a9a" font-family="sans-serif">N</text>
          </g>
        </svg>
      </div>
      <button id="rotR" data-i18n-title="rotR" title="">⟳</button>
    </div>
    <div class="nrow">
      <button id="tiltDn" data-i18n-title="tiltTop" title="">▲</button>
      <button id="tiltUp" data-i18n-title="tiltGround" title="">▼</button>
    </div>
    <div class="nrow">
      <button id="zOut" data-i18n-title="zoomOut" title="">−</button>
      <button id="zIn" data-i18n-title="zoomIn" title="">+</button>
    </div>
    <div class="cap" data-i18n="navCap">…</div>
  </div>
  <div class="altctl" data-i18n-title="viewAlt" title="">
    <input id="altsl" type="range" class="vslider" step="0.5" aria-label="viewpoint altitude">
  </div>
</div>

<div id="chasenav" class="card">
  <div class="nrow">
    <button id="cOrbitL" data-i18n-title="orbitL" title="">⟲</button>
    <button id="cReset" data-i18n-title="resetCam" title="">⌖</button>
    <button id="cOrbitR" data-i18n-title="orbitR" title="">⟳</button>
  </div>
  <div class="nrow">
    <button id="cElUp" data-i18n-title="camUp" title="">▲</button>
    <button id="cElDn" data-i18n-title="camDown" title="">▼</button>
  </div>
  <div class="nrow">
    <button id="cFar" data-i18n-title="camFar" title="">−</button>
    <button id="cNear" data-i18n-title="camNear" title="">+</button>
  </div>
  <div class="cap" data-i18n="chaseNavCap">…</div>
</div>

<div id="graphs" class="card">
  <div id="graphTabs" class="seg"></div>
  <button id="graphClose" title="">✕</button>
  <canvas id="graphCanvas"></canvas>
</div>

<div id="traffic" class="card">
  <canvas id="trafficCanvas"></canvas>
</div>

<div id="hud" class="card">
  <div class="hregrow">
    <button id="prevAc" class="acnav" data-i18n-title="prevAc" title="">◀</button>
    <div class="hreg" id="hudreg">—</div>
    <button id="nextAc" class="acnav" data-i18n-title="nextAc" title="">▶</button>
  </div>
  <div class="g">
    <div class="k" data-i18n="hdg">Cap</div><div class="v" id="hudhdg">—</div>
    <div class="k" data-i18n="speed">Vitesse</div><div class="v" id="hudspd">—</div>
    <div class="k" data-i18n="alt">Altitude</div><div class="v" id="hudalt">—</div>
    <div class="k" data-i18n="wind">Vent</div><div class="v" id="hudwind" style="display:flex;align-items:center;gap:6px"><svg id="hudwindbarb" viewBox="0 0 36 36" width="28" height="28" style="flex:0 0 auto;overflow:visible"></svg><span id="hudwindtxt">—</span></div>
    <div class="k" data-i18n="vario">Vario</div><div class="v vario" id="hudvar">—</div>
    <div class="k" id="hudnettoK" data-i18n="netto" style="display:none">Netto</div><div class="v vario" id="hudnetto" style="display:none">—</div>
    <div class="k" id="hudsuperK" data-i18n="superNetto" style="display:none">Super netto</div><div class="v vario" id="hudsuper" style="display:none">—</div>
  </div>
</div>

<div id="guide" role="dialog" aria-modal="true" aria-labelledby="guideBody">
  <div class="guide-card">
    <button id="guideClose" data-i18n-title="guideClose" title="">✕</button>
    <div id="guideBody" class="md"></div>
  </div>
</div>

<div id="tpModal" role="dialog" aria-modal="true">
  <div class="tp-card">
    <button id="tpClose" title="">✕</button>
    <h2 data-i18n="teleport">Téléportation</h2>
    <div class="tp-note" data-i18n="teleportHint"></div>
    <div class="tp-field">
      <input id="gotoPlace" type="text" autocomplete="off" spellcheck="false" placeholder="lat, lon · code · nom">
      <div id="tpSug" class="tp-sug"></div>
    </div>
    <div class="tp-row">
      <label class="tp-lab"><span id="gotoAltLab">Altitude (m)</span><input id="gotoAlt" type="number" value="1000" step="50"></label>
      <label class="tp-chk"><input id="gotoAgl" type="checkbox" checked><span data-i18n="agl">sol</span></label>
      <label class="tp-lab"><span data-i18n="gotoHdgHint">Cap initial (°)</span><input id="gotoHdg" type="number" value="0" min="0" max="359" step="10"></label>
    </div>
