<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OGN 3D Replay</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="stylesheet" href="css/style.css">
<!-- deck.gl, UPNG and pako are bundled from npm by Bun; terrain tiles are decoded
     with UPNG on the main thread (deck.gl's worker path mangles the RGB-encoded
     elevation when served over http). See src/terrain.ts. -->
<script type="module" src="./src/main.ts"></script>
</head>
<body>
<div id="map"></div>
<div id="sun"></div>
<div id="moon"></div>

<div id="panel" class="card">
  <div class="row spread hdr" style="margin-top:0">
    <h1 data-i18n="h1">…</h1>
    <div style="display:flex;gap:6px;align-items:center">
      <button id="copyBtn" data-i18n-title="copyLink" title="">🔗</button>
      <button id="infoBtn" data-i18n-title="info" title="">ⓘ</button>
      <select id="lang" class="langsel" aria-label="Language"></select>
      <button id="collapseBtn" data-i18n-title="collapse" title="">▾</button>
    </div>
  </div>
  <div class="sub" data-i18n="sub">…</div>
  <div id="disclaimer" class="disc" style="display:none"></div>

  <div class="row" style="flex-direction:column;align-items:stretch">
    <div class="row spread" style="margin:0 0 3px;align-items:baseline">
      <label class="lbl" style="margin:0" data-i18n="airfieldLabel">Aérodrome (OACI)</label>
      <a id="fblink" class="fblink" target="_blank" rel="noopener" data-i18n-title="flightbook" title="">FlightBook ↗</a>
    </div>
    <div class="ac">
      <input id="icao" type="text" autocomplete="off" placeholder="LFMX" value="LFMX">
      <div id="aclist" class="aclist"></div>
    </div>
  </div>
  <div class="row" style="align-items:flex-end">
    <div style="flex:1">
      <label class="lbl" data-i18n="dateLabel">Date</label>
      <input id="date" type="date">
    </div>
    <button id="load" class="on" data-i18n="loadBtn">Charger</button>
  </div>
  <div class="row seg" style="gap:6px">
    <button id="todayBtn" data-i18n="today" style="flex:1">Aujourd'hui</button>
    <button id="yestBtn" data-i18n="yesterday" style="flex:1">Hier</button>
  </div>
  <div class="row"><button id="liveBtn" data-i18n="live" style="flex:1">🔴 En direct</button></div>
  <div class="row"><button id="igcBtn" data-i18n="loadIgc" data-i18n-title="igcHint" style="flex:1">📂 Fichier de trace…</button></div>
  <input id="igcInput" type="file" accept=".igc,.IGC,.gpx,.GPX,.kml,.KML" multiple hidden>
  <div class="status" id="status"></div>

  <div id="controls">
    <div class="sep"></div>
    <div class="row"><span class="clock"><span id="clk">--:--</span><small id="tz" data-i18n="localTz">…</small></span><span id="liveBadge"><span class="livedot"></span><span data-i18n="liveLabel">EN DIRECT</span></span></div>

    <div class="row liveHide">
      <button id="play" class="on">⏸ Pause</button>
      <div class="seg" id="speeds"></div>
    </div>
    <div class="row liveHide" style="flex-direction:column;align-items:stretch">
      <label class="lbl" data-i18n="timeOfDay">Heure de la journée</label>
      <input id="scrub" type="range" min="0" max="1000" value="0" step="1">
      <div class="scrubends"><span id="scrubMin">--:--</span><span id="scrubMax">--:--</span></div>
    </div>

    <div class="row">
      <label class="lbl" style="margin:0" data-i18n="view">Vue</label>
      <div class="seg" id="views"></div>
    </div>
    <div class="row fpvOnly">
      <label class="lbl" style="margin:0" data-i18n="camera">Caméra</label>
      <div class="seg" id="cammode"></div>
    </div>
    <div class="row subjOnly">
      <label class="lbl" style="margin:0" data-i18n="subject">Planeur suivi</label>
      <select id="subject"></select>
    </div>
    <div class="row subjOnly spread">
      <label class="lbl" style="margin:0" data-i18n="sound">Son du vario</label>
      <button id="soundBtn" class="on">Activé</button>
    </div>
    <div class="row subjOnly spread">
      <label class="lbl" style="margin:0" data-i18n="antiColl">Anti-collision</label>
      <select id="trafficMode" style="width:auto;flex:0 0 auto"></select>
    </div>
    <div class="row spread">
      <label class="lbl" style="margin:0" data-i18n="graphs">Graphes</label>
      <select id="graphMode" style="width:auto;flex:0 0 auto"></select>
    </div>

    <div class="row">
      <label class="lbl" style="margin:0" data-i18n="trace">Trace</label>
      <select id="trace"></select>
    </div>
    <div class="row spread">
      <label class="lbl" style="margin:0" data-i18n="smooth">Lissage (spline)</label>
      <button id="smoothBtn" class="on">Activé</button>
    </div>
    <div class="row spread">
      <label class="lbl" style="margin:0" data-i18n="varioComp">Vario compensé (énergie totale)</label>
      <button id="compBtn" class="on">Activé</button>
    </div>
    <div class="row windowOnly" style="flex-direction:column;align-items:stretch">
      <label class="lbl"><span data-i18n="windowLabel">Fenêtre (min) :</span> <b id="winval">10</b></label>
      <input id="win" type="range" min="1" max="30" value="10" step="1">
    </div>

    <div class="row" style="flex-direction:column;align-items:stretch">
      <label class="lbl"><span data-i18n="exo">Exagération du relief vertical :</span> <b id="exval">1.0×</b></label>
      <input id="exo" type="range" min="1" max="6" value="1" step="0.5">
    </div>
    <div class="row followOnly spread">
      <label class="lbl" style="margin:0" data-i18n="bank">Inclinaison de l'horizon</label>
      <button id="bankBtn" class="on">Activé</button>
    </div>
    <div class="row followOnly" style="flex-direction:column;align-items:stretch">
      <label class="lbl"><span data-i18n="gaze">Regard (assiette caméra) :</span> <b id="pitchval">+6°</b></label>
      <input id="pitch" type="range" min="-25" max="25" value="6" step="1">
    </div>
    <div class="row freeOnly"><span class="hint" style="margin:0" data-i18n="freeHint">…</span></div>
    <div class="row"><button id="reset" data-i18n="defaultView">↺ Vue par défaut</button></div>
    <div class="hint" data-i18n="shortcuts">…</div>
  </div>
</div>

<div id="legend" class="card"><div class="ttl" data-i18n="legendTitle">…</div><div id="focusBadge"></div><div id="lglist"></div></div>

<div id="nav" class="card">
  <div class="navcol">
    <div class="nrow">
      <button id="rotL" data-i18n-title="rotL" title="">⟲</button>
      <div id="compass" class="compass" data-i18n-title="northUp" title="">
        <svg viewBox="0 0 40 40" width="42" height="42" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="18" fill="#0e141b" stroke="rgba(255,255,255,.28)" stroke-width="1.5"/>
          <g id="rose">
            <polygon points="20,4 24,20 20,16.5 16,20" fill="#ff5b5b"/>
            <polygon points="20,36 24,20 20,23.5 16,20" fill="#c7d2dd"/>
            <text x="20" y="12" text-anchor="middle" font-size="7" fill="#ff9a9a" font-family="sans-serif">N</text>
          </g>
        </svg>
      </div>
      <button id="rotR" data-i18n-title="rotR" title="">⟳</button>
    </div>
    <div class="nrow">
      <button id="tiltDn" data-i18n-title="tiltTop" title="">▲</button>
      <button id="tiltUp" data-i18n-title="tiltGround" title="">▼</button>
    </div>
    <div class="nrow">
      <button id="zOut" data-i18n-title="zoomOut" title="">−</button>
      <button id="zIn" data-i18n-title="zoomIn" title="">+</button>
    </div>
    <div class="cap" data-i18n="navCap">…</div>
  </div>
  <div class="altctl" data-i18n-title="viewAlt" title="">
    <input id="altsl" type="range" class="vslider" step="0.5" aria-label="viewpoint altitude">
  </div>
</div>

<div id="chasenav" class="card">
  <div class="nrow">
    <button id="cOrbitL" data-i18n-title="orbitL" title="">⟲</button>
    <button id="cReset" data-i18n-title="resetCam" title="">⌖</button>
    <button id="cOrbitR" data-i18n-title="orbitR" title="">⟳</button>
  </div>
  <div class="nrow">
    <button id="cElUp" data-i18n-title="camUp" title="">▲</button>
    <button id="cElDn" data-i18n-title="camDown" title="">▼</button>
  </div>
  <div class="nrow">
    <button id="cFar" data-i18n-title="camFar" title="">−</button>
    <button id="cNear" data-i18n-title="camNear" title="">+</button>
  </div>
  <div class="cap" data-i18n="chaseNavCap">…</div>
</div>

<div id="graphs" class="card">
  <div id="graphTabs" class="seg"></div>
  <button id="graphClose" title="">✕</button>
  <canvas id="graphCanvas"></canvas>
</div>

<div id="traffic" class="card">
  <canvas id="trafficCanvas"></canvas>
</div>

<div id="hud" class="card">
  <div class="hreg" id="hudreg">—</div>
  <div class="g">
    <div class="k" data-i18n="hdg">Cap</div><div class="v" id="hudhdg">—</div>
    <div class="k" data-i18n="speed">Vitesse</div><div class="v" id="hudspd">—</div>
    <div class="k" data-i18n="alt">Altitude</div><div class="v" id="hudalt">—</div>
    <div class="k" data-i18n="vario">Vario</div><div class="v vario" id="hudvar">—</div>
  </div>
</div>

</body>
</html>
